name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualite:
    name: Lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Installer les dépendances (versions verrouillées)
        run: uv sync --locked

      - name: Lint et format (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests (ceux qui exigent les données du challenge sont sautés)
        run: uv run pytest -q -rs
